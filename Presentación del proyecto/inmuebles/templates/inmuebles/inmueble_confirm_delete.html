{% extends "base.html" %}
{% block titulo %}Eliminar inmueble{% endblock %}
{% block contenido %}
    <h1>Eliminar inmueble</h1>
    <p>¿Seguro que quieres eliminar el inmueble <strong>"{{ inmueble.nombre }}"</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn" type="submit" style="background:#b00020;">Sí, eliminar</button>
        <a class="btn btn-secundario" href="{% url 'cuentas:perfil' %}">Cancelar</a>
    </form>
{% endblock %}
